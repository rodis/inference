# Left the car's WiFi hotspot — a DIRECTIONAL exit signal (issue #33).
#
# The valuable half of the pair. Measured against the current `got_out_the_car` over 07-25→07-28
# it lands +6s…+50s after it — tighter than any other exit evidence we have — and it is a fact
# about the car rather than a phone peripheral, so it does not share the charger's and CarPlay's
# mid-drive flap (the #4 / ADR 0005 failure path).
#
# Unlike the BMW-native lock (issue #3) this is phone-side, so it does not depend on the car
# having connectivity at the boundary — the CarData stream is reachable at only ~75% of drive
# starts and ~88% of ends, mostly underground parking, whereas the phone's producer queues and
# retries. Coverage measured here: 7/7 real trips.
#
# OBSERVATION-ONLY for now (see car_wifi_connected.yml for the measurement and the reasoning).
# Two things this window did settle, both negative and worth not re-testing blind:
#   - Dropping the ambiguous `car_lock_state_change` once WiFi is available REGRESSES
#     (real_trips 10->8, junk_trips 0->1) — scripts/backtest_candidates/wifi_drop_ambiguous_lock.yml.
#   - WiFi does NOT buy enough headroom to close #2 by demoting the door in got_out: the demotion
#     costs a real trip and mints a 32s junk trip with or without the WiFi weights
#     (scripts/backtest_candidates/wifi_fixes_phantom2.yml vs door4_control.yml). #2 needs a
#     different fix.
name: car_wifi_disconnected
enabled: true

engine: ssid_edge
engine_config:
  ssid: BMW 73638
  direction: disconnect
  field: wifi
  sources: [overland]        # see car_wifi_connected.yml — absent field == not joined

source_topic: raw_sensors
sink_topic: high_level_events
