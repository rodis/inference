# A trip: you went somewhere (Activity level). The generic journey — derived from MOTION in
# the raw location stream, with no car peripherals involved, so it sees a drive in a borrowed
# car, a ride as a passenger, a train, or a walk. `car_trip` is then the car-EVIDENCED
# specialisation of this, not a competitor to it.
#
# Why it exists (issue #41): `car_trip` pairs boundaries inferred from YOUR car's lock /
# CarPlay / BMW door, so a journey in anyone else's car is not mistuned there — it is
# invisible. On 2026-07-30 a 24km drive to the vet in a borrowed car was recorded by Overland
# in full (123 fixes out, 104 back, max 119km/h, bounding-box extent 13.9km each way) and
# bracketed by two real `stay` events, Home then ENNETSeeKLINIK — and nothing derived fired.
# Over the 14 days around it, 6 of 26 movement segments had no `car_trip`.
#
# This is the structural complement of `stay`: same stream, same geometry primitives, keyed on
# the cluster BREAKING rather than holding. ADR 0007 measured what that leaves behind — a
# 13-minute drive "fragmented into ~35 singleton clusters", correctly producing no stay. Those
# singletons are this event. See ADR 0010 and the engine docstring.
name: trip
enabled: true

engine: trip_window
engine_config:
  # The one parameter that decides both "you left" and "you arrived": a fix within this of the
  # running centroid is the same cluster. Mirrors stay.yml's radius_m so the two engines agree
  # on what standing still looks like. Movement is judged by DISPLACEMENT, never by the phone's
  # motion label — issue #44: `motion` stays "driving" with vel 0 for minutes after parking, and
  # trusting it ran every measurable journey long, by up to 21 minutes at the arrival end.
  settle_radius_m: 60

  # A cluster holding this long means arrived, not stopped at a light. Set to stay.yml's
  # min_dwell_seconds so the complementarity is EXACT: below this neither a stay nor a trip-end
  # exists, above it both do, at the same instant. The arrival is still DATED at the cluster's
  # first fix, so waiting to be sure costs latency, not accuracy.
  settle_seconds: 300

  # Bounding-box EXTENT, not net displacement: a drive out and back is still a drive
  # (the reasoning validated_session_window records). Measured on the 14 days to 2026-08-01:
  # real journeys spanned 611m-13.9km, while 15 minutes of wandering the vet car park covered
  # ~100m over 510m of walking path — so 500m clears the noise with room on both sides and
  # keeps car-park drift from becoming a journey.
  min_distance_m: 500
  min_duration_seconds: 180
  min_fixes: 4                 # the fixes are the ONLY evidence here, so sparse = nothing to report

  # A sampling outage this long ends the trip where it was last seen: no evidence, no claim.
  max_gap_seconds: 1800
  # A `motion` array stuck on `driving` must not accumulate an unbounded run. 6h mirrors
  # car_trip's max_duration_seconds.
  max_duration_seconds: 21600
  max_accuracy_m: 100          # a fix vaguer than this can't place you (mirrors stay.yml)

  # Events that CORROBORATE a journey without defining it. They never open, extend or close a
  # run — the span comes from motion alone — they only ride along as evidence when they fall
  # strictly inside one, and the `vehicle` capability reports what was found. This is what
  # makes `car_trip` expressible as "a trip with a got_into and a got_out in it", and it is
  # why the direction ambiguity of #2/#23 stops mattering here: a lock on the wrong side of
  # the boundary still proves the car was involved, because it no longer has to BE the
  # boundary. Measured 25 Jul-1 Aug: all 14 own-car journeys carried at least one of these
  # inside the span (12 both), all 6 borrowed-car ones carried none.
  corroborating_events: [got_into_the_car, got_out_the_car]

  # How far outside the span a corroborating event may sit and still count. NOT zero, because a
  # correctly-measured journey systematically excludes both boundaries: you get in before the
  # phone leaves the departure cluster and get out after it enters the arrival one (measured
  # median: 58s before the start, 18s after the end). Strict containment found evidence on only
  # 6 of 21 journeys where 15 were in the user's own car; 60s recovers 14 of them. Wider pads
  # buy nothing real — 120s and 180s add 1 and 3 more, all of them borrowed-car legs gaining a
  # phantom exit. 60s is also principled rather than fitted: it is about one sampling interval,
  # which is the actual uncertainty in where the span's edge sits.
  # It cannot widen `interval`, which is derived from the located fixes alone.
  corroboration_pad_seconds: 60

source_topic: raw_sensors
sink_topic: high_level_events

# interval: departure -> arrival, projected from the lineage extent — and both bounds are
#   SETTLED fixes, not moving ones, so the span covers the whole journey.
# journey: origin + destination as labelled places (this trip reads Home -> ENNETSeeKLINIK),
#   straight-line and path distance, and the mode from the stream's own classification.
#   `place` would be wrong here: the centroid of a 24km drive is a field beside the motorway.
# vehicle: which corroborating signals landed inside the span, so "was this my own car?" is a
#   property of the journey rather than a separate event. Absent when nothing corroborated —
#   the peripherals may simply have been off, so absence asserts nothing (see inference.event).
capabilities: [interval, journey, vehicle]
