# Getting into the car, derived directly from the 3 raw entry signals (ADR 0005). The old
# car_door_opened intermediate was dropped: it hard-required car_lock_state_change AND a
# CarPlay-connect (an AND gate), so a missing lock-change killed the whole chain — observed
# 2026-07-16, when entry fired CarPlay + power but no lock-change, so no trip formed.
#
# CarPlay-anchored weights (issue #39, 2026-08-02). The wireless-charger signals
# (device_connected_to_power / device_disconnected_from_power) were retired: the Shortcut fired on
# every power change (~38/day, ~70% of them the phone charging at home), which was a real battery
# cost for a signal whose in-car role the other three could carry. CarPlay-connect is the anchor
# now (6) — it is the one remaining signal that is DIRECTIONAL (a connect only happens at entry) —
# and the lock-change and the BMW door corroborate at 4 each, because both fire at entry AND exit
# and so must never complete an entry between themselves. Threshold 10:
#   - CarPlay + lock          = 10 → fires   (entry with the door signal absent/late)
#   - CarPlay + door          = 10 → fires   (entry with no lock-change — the 2026-07-16 shape)
#   - lock + door             = 8  → NO fire (the EXIT combination; ambiguous signals can
#                                             corroborate but never decide — ADR 0005)
#   - CarPlay + lock + door   = 13 → fires   (the common case: 25 of 28 replayed entries)
#   - any single signal       < 10 → NO fire
#
# Two things the charger's departure changes, both measured before landing (scripts/trip_eval.py,
# candidate drop_charger_c_carplay_anchor, 12-day post-BMW-door window, 25 CarPlay drives):
#
# 1. CarPlay + lock now fires. That pair was deliberately blocked while the charger anchored
#    (the 2026-07-17 park-and-settle phantom: CarPlay bounces connect/disconnect while parking,
#    with a stale entry-unlock still in the window). Measured with the current signal set the
#    phantom class did not return — 0 junk trips vs 0 for the incumbent — because the charger's
#    own mid-drive re-seats were what kept stale completers in the window (the max_age_seconds
#    cap existed solely to contain that, and left with it). The pre-door era shows what this
#    pair does WITHOUT the BMW door: 2 junk trips on 07-19 alone. If the door stream dies,
#    this tuning inherits that risk.
#
# 2. An entry where CarPlay fails to connect no longer fires — lock + door = 8 cannot reach 10
#    without it. Measured at ~7% of entries (2 of 27 real trips over the window, the door+lock+
#    charger lineages). Accepted deliberately: those journeys are still derived by `trip` from
#    the location stream, and their car involvement still lands in its `vehicle` capability via
#    whichever boundary DID fire (a got_out alone corroborates). What is lost is the dedicated
#    car_trip event on those drives, not the journey.
#
# Boundary quality improved with the charger gone: mean car_trip end error −55s → −14s and
# >2-min-early closes 3 → 2 over the same window, because a mid-drive charger unplug was the
# main early-close path. See issue #39 for the full decision record, including the alternatives
# that were measured and rejected (door-as-anchor: catastrophic, 16 junk in 8 days).
name: got_into_the_car
enabled: true

engine: weighted_window
engine_config:
  threshold: 10
  window_seconds: 600
  cooldown_seconds: 600   # 10 min — fires at most once per trip
  weights:
    device_connected_to_carplay: 6  # anchor: DIRECTIONAL (connect only happens at entry)
    car_lock_state_change: 4        # ambiguous: fires at entry AND exit
    # BMW car-native, phone-INDEPENDENT corroborator (ADR 0006). ~94% per-trip coverage once
    # the CarData stream settled (33%→~94%, confirmed 2026-07-24 over ~30 trips). Motion/ignition
    # never stream on this X1, so the door is the one true second source — but it is also
    # non-directional (and bursts while loading the car), so it sits at 4 with the lock: it
    # corroborates the directional anchor, it never completes an entry with the lock alone.
    car_driver_door_opened: 4

source_topic: raw_sensors
sink_topic: high_level_events
