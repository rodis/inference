# A stay: you stopped somewhere long enough for it to count (Activity level). Derived from the
# raw location stream by clustering consecutive fixes, NOT by crossing a declared fence —
# see the engine docstring and ADR 0007 for why edges don't work on a real phone stream.
#
# This is deliberately place-AGNOSTIC: it emits one `stay` per cluster carrying its centroid
# and duration, and says nothing about which place that is. Naming a stay ("the Konditorei")
# is a labelling step over centroids, and a stay whose centroid matches nothing is still
# useful — "42 min somewhere at 47.195,8.524" can be labelled later, which is a discovery
# loop rather than a declare-everything-first one.
#
# Parameters are the ones measured against real Overland history (2026-07-25), not guesses:
# radius 60m / dwell 300s produced exactly two stays for the day — 96.8min at a shop (47
# fixes) and 27.7min at home (16 fixes, centroid 10m from the true location) — while the
# 13-minute drive between them fragmented into ~35 singleton clusters that correctly produced
# nothing. max_accuracy_m 100 drops the vague fixes (p90 was 36m, max 169m).
name: stay
enabled: true

engine: stay_window
engine_config:
  radius_m: 60
  min_dwell_seconds: 300     # 5 min — below this you were passing through
  max_accuracy_m: 100        # a fix vaguer than this can't place you
  max_gap_seconds: 3600      # a sampling outage longer than this ends the stay, so an iOS
                             # suspension can't fuse two visits hours apart into one

  # The two #56 guards, measured on a 25-day replay (2026-08-08) in which HALF of all stays
  # (39/78) were cut short against the evidence — six timeline-visible visits in nine days,
  # three with a card payment sitting in the wrongly-dropped stretch.
  break_fixes: 3             # one noisy fix must not shatter a visit: a 47m-accuracy fix
                             # 61.5m from the centroid (1.5m past the radius) split a real
                             # 2.5h bakery visit into 5min + 131min on 2026-08-07. Three
                             # consecutive outside fixes = ~30s of real Overland cadence, so
                             # a genuine departure closes barely later than before (and the
                             # stay's END is the last inside fix either way).
  rejoin_max_hole_seconds: 7200
                             # a closed stay resumes if the stream rejoins its cluster within
                             # 2h: 33 of the 39 blackout-closed stays rejoined (median ~10m
                             # from centroid), and every observed repairable hole was under
                             # 2h. Bounded, because past some silence "stayed" vs "left and
                             # came back" is genuinely unknowable — that ambiguity is what
                             # max_gap_seconds has always guarded.
  departure_distance_m: 500  # ...but a fix this far from the held cluster proves a real
                             # departure and finalizes it immediately — mirrors trip.yml's
                             # min_distance_m: the same displacement that makes a journey
                             # real makes a return a SECOND visit. ADR 0009: a physical
                             # fact, not a weight.

source_topic: raw_sensors
sink_topic: high_level_events

# Fires at departure with the last fix INSIDE as its event-time, so start/end bound the
# actual dwell (the interval capability projects them from the lineage).
# place: the centroid of the contributing fixes (+ spread) and the known place it
# matched, if any. An unmatched stay still carries WHERE it was — that is the raw
# material for naming the place later, not a failure (ADR 0007).
capabilities: [interval, place]
