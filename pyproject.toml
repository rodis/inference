[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inference"
authors = [
    {name = "Rosario Di Sommma", email = "rosario.disomma@dreamhost.com"},
]
description = "Event Inference Base Worker Classes"
readme = "README.md"
version = "0.0.0"
requires-python = ">=3.13"
license = {text = "Apache Software License 2.0"}
dependencies = [
    "quixstreams>=3.24,<4",   # the runtime data plane (ADR 0004); bundles confluent-kafka
    "pydantic>=2.6",
    "python-dotenv",
    "pyyaml",
    "psycopg[binary]>=3.1",   # runtime reads geofence regions from Neon (adapter-only; imported lazily)
]

[tool.hatch.build.targets.wheel]
# `reconciler` is the process tier (ADR 0012) — a package BESIDE `inference`, not inside it:
# it acts (email, PDF, LLM), and `inference` must never do any of that. Its core is pure, so
# it needs nothing beyond the deps above; the runner/integration deps live in the
# `processes` extra so the runtime image never grows a Prefect tree for code it doesn't run.
packages = ["src/inference", "src/reconciler"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
# NOTE: the process tier still adds NO dependency of its own. Every outside-world adapter —
# mail, PDF, Gmail query, LLM — is plain `urllib` against an HTTP endpoint, so `reconciler`
# installs and tests with nothing beyond the base. The `processes` extra referenced above is
# where the RUNNER (Prefect) will land when `flow.py` is written; it does not exist yet, and
# adding an empty one would only imply a dependency that isn't there.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
respect-gitignore = true
