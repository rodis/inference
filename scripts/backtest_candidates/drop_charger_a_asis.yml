# Drop the charger from BOTH maps, change nothing else. Entry pool becomes carplay 5 + lock 4
# + door 4 = 13 vs threshold 11 — so entry needs CarPlay AND both ambiguous signals (an AND gate).
got_into_the_car:
  max_age_seconds: {}
  weights: {device_connected_to_carplay: 5, car_lock_state_change: 4, car_driver_door_opened: 4}
got_out_the_car:
  weights: {device_disconnected_from_carplay: 6, car_lock_state_change: 5, car_driver_door_opened: 5}
