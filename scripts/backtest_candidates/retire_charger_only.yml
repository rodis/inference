# Drop only the WIRELESS CHARGER (the flakiest — ADR 0005 records it re-seating every few
# minutes mid-drive, and it is #4's phantom path), keeping CarPlay which is at least directional.
got_into_the_car:
  weights: {device_connected_to_carplay: 5, car_lock_state_change: 4, car_driver_door_opened: 4, car_wifi_connected: 6}
got_out_the_car:
  weights: {device_disconnected_from_carplay: 6, car_lock_state_change: 5, car_driver_door_opened: 5, car_wifi_disconnected: 6}
