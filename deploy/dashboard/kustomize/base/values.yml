# Aware dashboard on the Stakater `application` chart (same chart as the runtime).
# A stateless web pod: serves the page + a read-only Neon API. No ingress yet (DNS
# is added manually); reach it via the Service / port-forward for now.
applicationName: aware-dashboard

deployment:
  replicas: 1
  image:
    repository: ghcr.io/rodis/inference-dashboard
    tag: "sha-bootstrap"   # placeholder; publish-images.yml bumps this to sha-<short> on deploy-state
    pullPolicy: IfNotPresent
  env:
    # Map Doppler's NEON_DATABASE_URL (dashboard-specific secret) to the DATABASE_URL
    # the app uses. Reads the events table; also writes its own dashboard_prefs table
    # (per-user level/lift config). The URL carries sslmode=require.
    DATABASE_URL:
      valueFrom:
        secretKeyRef:
          name: neon-credentials-for-dashboard
          key: NEON_DATABASE_URL
    # Shared HTTP Basic password guarding the public dashboard (one user for now).
    # Same managed secret as the DB URL; the app 401s every request if this is unset.
    DASHBOARD_PASSWORD:
      valueFrom:
        secretKeyRef:
          name: neon-credentials-for-dashboard
          key: DASHBOARD_PASSWORD
    # --- the email todo board's one outbound action ---
    # Ticking a task off removes the `aware/todo` label in Gmail and records an
    # `email_task_closed` event. This is the only thing the dashboard writes outside its own
    # dashboard_prefs table, and it holds no Google credential to do it: the OAuth token stays
    # in n8n, and this calls a relay that may transmit but never decides.
    #
    # All three are OPTIONAL. Missing any of them disables the tick with a 503 that names what
    # is unset — reading the board still works, so a half-configured deploy degrades to the
    # read-only view rather than to a broken page. Closing a task in Gmail directly still works
    # regardless, because the hourly sweep is what notices that.
    GMAIL_LABEL_URL:
      valueFrom:
        secretKeyRef:
          name: neon-credentials-for-dashboard
          key: GMAIL_LABEL_URL
          optional: true
    MAIL_RELAY_TOKEN:
      valueFrom:
        secretKeyRef:
          name: neon-credentials-for-dashboard
          key: MAIL_RELAY_TOKEN
          optional: true
    VECTOR_BASE_URL:
      valueFrom:
        secretKeyRef:
          name: neon-credentials-for-dashboard
          key: VECTOR_BASE_URL
          optional: true
  ports:
    - name: http
      containerPort: 8000
      protocol: TCP
  livenessProbe:
    httpGet:
      path: /healthz
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 20
  readinessProbe:
    httpGet:
      path: /healthz
      port: 8000
    initialDelaySeconds: 5
    periodSeconds: 10
  resources:
    requests:
      cpu: 25m
      memory: 96Mi
    limits:
      cpu: 150m
      memory: 256Mi

service:
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP

# Traefik runs as the `nginx` ingress controller in this cluster. cert-manager issues
# the TLS cert (letsencrypt-prod) into aware-dashboard-tls once DNS for the host points
# at the cluster (HTTP-01 challenge). Path backend defaults to this app's service on its
# `http` port, so serviceName/servicePort are omitted.
ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: aware.prod.rods.me
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: aware-dashboard-tls
      hosts:
        - aware.prod.rods.me
