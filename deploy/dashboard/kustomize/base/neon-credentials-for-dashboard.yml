apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: neon-credentials-for-dashboard
  namespace: doppler-operator-system
spec:
  tokenSecret:
    name: doppler-token-secret
    namespace: doppler-operator-system
  project: kafka-aiven-credentials
  config: prd
  # Same source as neon-credentials-for-vector, but a dashboard-specific managed
  # secret. NEON_DATABASE_URL maps to DATABASE_URL; DASHBOARD_PASSWORD is the shared
  # HTTP Basic credential guarding the public dashboard (one user for now).
  #
  # `secrets:` is an ALLOW-LIST, and that is the thing to remember: a key added in
  # Doppler and not named here is simply never synced into the managed Secret. The
  # symptom is silent — the app sees an unset variable and behaves as if it were
  # unconfigured, with nothing anywhere reporting a problem. Every key listed must
  # also exist in kafka-aiven-credentials/prd, or the sync fails outright.
  #
  # The operator resyncs every 60s and reloads the Deployments that consume this
  # Secret, so adding a key here (and in Doppler) rolls the dashboard on its own.
  secrets:
    - NEON_DATABASE_URL
    - DASHBOARD_PASSWORD
    # The email todo board's tick: remove the Gmail label, record the close. All three
    # are consumed as `optional: true` in values.yml, so the board still READS if they
    # are missing — the tick 503s and names what is unset.
    - GMAIL_LABEL_URL
    - MAIL_RELAY_TOKEN
    - VECTOR_BASE_URL
  managedSecret:
    name: neon-credentials-for-dashboard
    namespace: inference
    type: Opaque
