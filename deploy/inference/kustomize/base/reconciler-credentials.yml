apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: reconciler-credentials
  namespace: doppler-operator-system
spec:
  tokenSecret:
    name: doppler-token-secret
    namespace: doppler-operator-system
  # NOT `prd`. The process tier's secrets live in their own `reconciler` config — the ROOT of
  # its own environment, so it inherits nothing and a token for it cannot see avnadmin's Kafka
  # private key, the BMW refresh token or the dashboard password. That scoping was designed for
  # Prefect (see src/reconciler/adapters/doppler.py) and the operator reads the same config, so
  # both runners resolve the same eight values from the one place they are authored.
  project: kafka-aiven-credentials
  config: reconciler
  #
  # NO `secrets:` ALLOW-LIST, DELIBERATELY — the whole config is synced.
  #
  # Everywhere else in this repo that list is load-bearing, because those configs hold secrets
  # for several consumers and each may see only its own. This config holds the reconciler's
  # secrets and nothing else, so "all of them" is exactly the right set, and naming them would
  # buy nothing while adding the one failure mode worth avoiding: `secrets:` is an allow-list
  # whose omissions are SILENT — a key added in Doppler and not listed here is simply never
  # synced, the app sees an unset variable, and nothing anywhere reports a problem.
  #
  # The payoff is that adding a ninth secret to the tier is a Doppler edit and nothing else.
  # No manifest change, no deploy, no allow-list to remember — the operator resyncs every 60s
  # and the next workflow pod picks it up. `envFrom` on the workflow container is the other
  # half of that: it injects whatever the Secret holds, so the container spec never enumerates
  # them either.
  #
  # (Doppler adds DOPPLER_PROJECT / DOPPLER_CONFIG / DOPPLER_ENVIRONMENT to every config, so
  # those ride along as env vars too. Harmless — the reconciler reads the names it wants.)
  #
  # --- the MySQL store (the migration off Neon) -----------------------------------------
  #
  # ONE field, authored BY THE OWNER in this config — the password never enters this repo:
  #
  #   MYSQL_DATABASE_URL = mysql://rods_reconciler:<urlencoded-password>@prod-mysql.rods.me:3306/rods_reconciler
  #
  # **Deliberately NOT the canonical/alias convention** used elsewhere in the estate, and the
  # reason is the two decisions above. That convention has `_CANONICAL` hold the literal while
  # consumers read a `${_CANONICAL}` alias, on the rule that an underscore field is never
  # consumed directly. It relies on an allow-list to keep the canonical out of the consumer's
  # reach — and this config has none, by design, with `envFrom` injecting everything it holds.
  # An underscore field here would be synced and injected into the pod environment ALONGSIDE
  # its own alias: two copies of the password in `env`, one of them the literal the convention
  # exists to keep unread. One plain field is the honest shape, and it matches every other
  # field here, NEON_DATABASE_URL included.
  #
  # **Percent-encode the password.** The whole DSN is one field and the adapter parses it as a
  # URL, so an unencoded `/`, `?` or `#` truncates the authority. Python then reports it as
  # "Port could not be cast to integer value", which sends you to inspect the one part of the
  # string that was fine; `adapters/mysql.py` replaces that message with one naming the real
  # cause, and a test pins a password containing @ : / ? # round-tripping with host, port and
  # database intact.
  #
  # The CA path is NOT in here — it is `MYSQL_SSL_CA` in `reconciler/values.yml`, beside the
  # volume that mounts it. A deploy-time path inside a secret would make moving the mount a
  # console edit with no diff; this way Doppler holds a credential and nothing else.
  #
  # There is no `?ssl=disable`: MySQL 8.4 dropped mysql_native_password, so the account
  # authenticates with caching_sha2_password, which needs TLS to log in at all. The adapter
  # refuses the option rather than letting a plaintext attempt fail as a bad password.
  #
  # Nothing reads MYSQL_DATABASE_URL until `RECONCILER_STORE` is flipped to `mysql` in
  # `reconciler/values.yml` — so it can be added now, in advance of the cutover.
  managedSecret:
    name: reconciler-credentials
    namespace: inference
    type: Opaque
