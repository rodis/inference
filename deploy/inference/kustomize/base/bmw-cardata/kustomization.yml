generators:
  - helmChart.yml

# BMW CarData permits exactly ONE MQTT connection per GCID (ADR 0006): a second subscriber on
# the same account evicts the first. The default RollingUpdate (maxSurge 25% -> 1 for a single
# replica) therefore starts the new subscriber while the old one still holds the only allowed
# connection, and they fight over it. Observed on the 2026-07-25 rollout — eviction surfaces as
# an auth failure, and the new pod only settled once the old one was gone:
#   10:03:06  mqtt disconnected: Unspecified error (auto-reconnect)
#   10:03:11  mqtt connect failed: Not authorized
#   10:03:19  mqtt connect failed: Not authorized
#   10:03:25  <old pod deleted>
#   10:03:35  connected (Success); subscribed to <gcid>/+
# ~56s of dropped stream per deploy, on a signal that now contributes to both got_into and
# got_out (~94% per-trip coverage). maxSurge 0 makes the handover strictly sequential: the old
# subscriber is scaled away BEFORE the new one starts, so the two never hold the connection at
# once. A few seconds with no subscriber is the right trade — this pod owns a singleton external
# connection, so it must never overlap itself. (The runtime is NOT patched: Kafka consumer-group
# rebalance handles overlapping consumers correctly.)
#
# The whole `strategy` object is set here, deliberately — two earlier attempts failed because
# the Stakater chart renders NO strategy key at all (the RollingUpdate 25%/25% visible on the
# live Deployment are API-server DEFAULTS, not chart values):
#   1. `op: add /spec/strategy value: {type: Recreate}` — built fine, but under this app's
#      ServerSideApply=true the server-defaulted rollingUpdate survived next to the new type:
#      "Deployment.apps bmw-cardata is invalid: spec.strategy.rollingUpdate: Forbidden: may not
#      be specified when strategy type is 'Recreate'" — which failed the sync for EVERY resource
#      in the app, not just this one.
#   2. `op: add /spec/strategy/rollingUpdate/maxSurge` — failed at kustomize BUILD time
#      ("missing path ... missing value"), because that parent path isn't in the manifest.
# Writing the complete object is immune to both: it creates the key when absent, replaces it
# when present, keeps type=RollingUpdate so no field is forbidden, and states both numbers
# explicitly so nothing depends on server defaults or SSA field ownership.
patches:
  - target:
      kind: Deployment
      name: bmw-cardata
    patch: |-
      - op: add
        path: /spec/strategy
        value:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 0
            maxUnavailable: 1
